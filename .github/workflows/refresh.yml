name: Daily refresh

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write           # lets the auto-release step dispatch publish.yml

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the auto-release step diffs data against the last tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Refresh every provider (missing keys are skipped, not failed)
        id: update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
        run: |
          set +e
          modelroster update --all --no-cache | tee refresh.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Live test suite
        if: steps.update.outputs.code == '0'
        env:
          MODELROSTER_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pytest tests/test_live.py -q
      - name: Commit refreshed data and drift reports
        # run even when one provider failed: successful providers wrote their
        # data, and a failed/refused provider wrote nothing (previous data
        # preserved), so committing is always safe
        if: always() && steps.update.outcome == 'success'
        run: |
          git config user.name "modelroster-bot"
          git config user.email "modelroster-bot@users.noreply.github.com"
          # add the directory, not a glob: explicit paths matching
          # .gitignore (*.previous.json, cache/) make git add exit 1
          git add src/modelroster/data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: daily refresh $(date -u +%F)" -m "$(modelroster diff | head -200)"
          git push
      - name: Auto-release on data drift
        # Fully-green refreshes only. The script releases only on real drift
        # since the last tag (never on timestamp churn), and refuses when
        # code/packaging changes are pending a deliberate human release.
        # publish.yml still runs the full test suite and data validation
        # before anything reaches PyPI.
        if: steps.update.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/auto_release.py | tee release.out
          grep -E '^(release|version|reason)=' release.out >> "$GITHUB_OUTPUT" || true
          if ! grep -q '^release=yes' release.out; then
            echo "not releasing: $(grep '^reason=' release.out | cut -d= -f2-)"
            exit 0
          fi
          v=$(grep '^version=' release.out | cut -d= -f2)
          git config user.name "modelroster-bot"
          git config user.email "modelroster-bot@users.noreply.github.com"
          git add src/modelroster/_version.py CHANGELOG.md
          git commit -m "release: $v (automatic, data-only)" -m "$(grep '^reason=' release.out | cut -d= -f2-)"
          git pull --rebase
          git push
          git tag -a "v$v" -m "modelroster $v — automatic data-only release"
          git push origin "v$v"
          gh workflow run publish.yml --ref "v$v"
          echo "released v$v and dispatched publish.yml"
      - name: Open an issue on validation refusal or fetch failure
        if: steps.update.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.update.outputs.code }}
        run: |
          existing=$(gh issue list --label refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "failure already tracked in open issue #$existing; not opening a duplicate"
          else
            title="Refresh failed with exit $CODE on $(date -u +%F)"
            body="$(printf 'Exit code %s (2 = validation refused, 3 = fetch failure, 4 = usage).\n\nSee MAINTAINERS.md. This issue stays the single tracker: while it is open, later failing runs will not open duplicates.\n\n```\n%s\n```' "$CODE" "$(tail -c 6000 refresh.log)")"
            gh issue create --title "$title" --body "$body" --label refresh-failure || true
          fi
          exit 1
