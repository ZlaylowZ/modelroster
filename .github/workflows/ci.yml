name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install patched pip (hash-pinned)
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install -e ".[dev]"
      - name: Offline test suite
        run: python -m pytest -q
      - name: Fixture replay of the full pipeline (exit 0, zero page failures)
        env:
          ANTHROPIC_API_KEY: fixture
          OPENAI_API_KEY: fixture
        run: modelroster --data-dir /tmp/mr update --provider openai --provider anthropic --dry-run --fixtures tests/fixtures -q
      - name: Shipped data validates
        run: modelroster validate
      - name: Wheel builds and installs cleanly with data
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /tmp/clean/bin/pip install --no-index dist/*.whl httpx 2>/dev/null || /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import modelroster; r = modelroster.load(); n = len(r.models(tool_calling=True, reasoning=True)); print(n); assert n > 0"
