name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}    # dispatched on a tag ref by the auto-release step of refresh.yml

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true
      - name: Install patched pip (hash-pinned)
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: modelroster validate
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import modelroster; print(modelroster.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
